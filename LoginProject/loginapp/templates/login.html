<!DOCTYPE html>
<html>
<head>
    <title>Django Login Application</title>
</head>
<body>
    <h2>User Login</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Login</button>
    </form>

    <p style="color:red">{{ message }}</p>
</body>
</html>
